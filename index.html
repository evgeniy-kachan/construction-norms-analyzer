<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анализатор строительных норм</title>
    <link rel="stylesheet" href="styles/main.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Анализатор строительных норм</h1>
      </header>

      <div class="toolbar">
        <button id="toggleHighlights" class="toolbar-button">
          Показать/скрыть нарушения
        </button>
      </div>

      <main>
        <div class="upload-section">
          <div class="drop-zone" id="dropZone">
            <p>Перетащите файл сюда или</p>
            <button id="uploadButton">Выберите файл</button>
            <input
              type="file"
              id="fileInput"
              accept=".pdf,.png,.jpg,.jpeg"
              hidden
            />
          </div>
          <div id="progressBar" class="progress-bar" hidden>
            <div class="progress-fill"></div>
            <div class="progress-text">Обработка...</div>
          </div>
        </div>

        <div class="preview-section" id="previewSection" hidden>
          <h2>Предпросмотр</h2>
          <div class="preview-container">
            <canvas id="previewCanvas"></canvas>
          </div>
        </div>

        <div class="results-section" id="resultsSection" hidden>
          <h2>Результаты анализа</h2>
          <div class="results-container">
            <div class="recognized-text">
              <h3>Распознанный текст</h3>
              <div class="text-list" id="textList"></div>
            </div>
            <div class="measurements">
              <h3>Размеры</h3>
              <div class="measurements-list" id="measurementsList"></div>
            </div>
            <div class="violations">
              <h3>Нарушения</h3>
              <div class="violations-list" id="violationsList"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="scripts/pdf.js"></script>
    <script src="scripts/imageAnalysis.js"></script>
    <script src="scripts/measurements.js"></script>
    <script src="scripts/imageProcessing.js"></script>
    <script src="scripts/normChecker.js"></script>
    <script src="scripts/violationHighlighter.js"></script>
    <script src="scripts/geometryAnalysis.js"></script>
    <script src="scripts/app.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const previewCanvas = document.getElementById('previewCanvas');
        const dropZone = document.getElementById('dropZone');
        const uploadButton = document.getElementById('uploadButton');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const resultsSection = document.getElementById('resultsSection');
        const violationsList = document.getElementById('violationsList');
        const textList = document.getElementById('textList');
        const measurementsList = document.getElementById('measurementsList');
        const progressBar = document.getElementById('progressBar');
        const progressFill = progressBar.querySelector('.progress-fill');
        const progressText = progressBar.querySelector('.progress-text');

        // Инициализируем подсветку нарушений
        window.normChecker.initHighlighter(previewCanvas);

        // Обработчик кнопки переключения видимости нарушений
        document
          .getElementById('toggleHighlights')
          .addEventListener('click', () => {
            window.normChecker.toggleHighlights();
          });

        // Обработчики загрузки файла
        dropZone.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
          dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
          e.preventDefault();
          dropZone.classList.remove('drag-over');
          const file = e.dataTransfer.files[0];
          handleFile(file);
        });

        uploadButton.addEventListener('click', () => {
          fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          handleFile(file);
        });

        async function updateProgress(percent, text) {
          progressFill.style.width = `${percent}%`;
          progressText.textContent = text;
        }

        async function handleFile(file) {
          if (!file) return;

          try {
            // Показываем прогресс-бар
            progressBar.hidden = false;
            updateProgress(0, 'Начало обработки...');

            // Очищаем предыдущие результаты
            violationsList.innerHTML = '';
            textList.innerHTML = '';
            measurementsList.innerHTML = '';
            window.normChecker.clearHighlights();

            // Обрабатываем файл
            updateProgress(20, 'Загрузка изображения...');
            let imageData;
            if (file.type === 'application/pdf') {
              imageData = await window.pdfProcessor.processPDF(file);
            } else {
              imageData = await window.imageProcessor.processImage(file);
            }

            // Отображаем изображение
            updateProgress(40, 'Анализ изображения...');
            previewCanvas.width = imageData.width;
            previewCanvas.height = imageData.height;
            const ctx = previewCanvas.getContext('2d');
            ctx.putImageData(imageData, 0, 0);

            // Анализируем изображение
            updateProgress(60, 'Распознавание текста и поиск нарушений...');
            const results = await window.imageAnalysis.analyzeImage(imageData);

            // Показываем секции
            previewSection.hidden = false;
            resultsSection.hidden = false;

            updateProgress(80, 'Отображение результатов...');

            // Отображаем распознанный текст
            if (results.roomTypes && results.roomTypes.length > 0) {
              results.roomTypes.forEach((room) => {
                const div = document.createElement('div');
                div.className = 'text-item';
                div.innerHTML = `
                  <span class="text-value">${room.type}</span>
                  <span class="text-confidence">(${Math.round(
                    room.confidence
                  )}%)</span>
                `;
                textList.appendChild(div);
              });
            } else {
              textList.innerHTML =
                '<div class="no-results">Текст не распознан. Убедитесь, что изображение четкое и содержит текст.</div>';
            }

            // Отображаем размеры
            if (results.measurements && results.measurements.length > 0) {
              results.measurements.forEach((measurement) => {
                const div = document.createElement('div');
                div.className = 'measurement-item';
                div.innerHTML = `
                  <span class="measurement-value">${measurement.value}${
                  measurement.unit
                }</span>
                  <span class="measurement-confidence">(${Math.round(
                    measurement.confidence
                  )}%)</span>
                `;
                measurementsList.appendChild(div);
              });
            } else {
              measurementsList.innerHTML =
                '<div class="no-results">Размеры не найдены. Проверьте, что на чертеже есть размеры в формате "число + единица измерения" (например, "2000 мм").</div>';
            }

            // Отображаем нарушения
            if (results.violations && results.violations.length > 0) {
              results.violations.forEach((violation) => {
                const div = document.createElement('div');
                div.className = 'violation-item';
                div.innerHTML = `
                  <h3>${violation.title}</h3>
                  <p>${violation.description}</p>
                  <p>Норма: ${violation.norm}</p>
                  <p>Фактическое значение: ${violation.actual}</p>
                `;
                violationsList.appendChild(div);
              });
            } else {
              violationsList.innerHTML =
                '<div class="no-violations">Нарушений не обнаружено</div>';
            }

            updateProgress(100, 'Готово');
            setTimeout(() => {
              progressBar.hidden = true;
            }, 1000);
          } catch (error) {
            console.error('Error processing file:', error);
            alert(
              'Произошла ошибка при обработке файла. Проверьте консоль разработчика для деталей.'
            );
            progressBar.hidden = true;

            // Показываем секции с сообщением об ошибке
            previewSection.hidden = false;
            resultsSection.hidden = false;

            textList.innerHTML =
              '<div class="error-message">Ошибка при распознавании текста</div>';
            measurementsList.innerHTML =
              '<div class="error-message">Ошибка при распознавании размеров</div>';
            violationsList.innerHTML =
              '<div class="error-message">Невозможно проверить нарушения</div>';
          }
        }
      });
    </script>
  </body>
</html>
